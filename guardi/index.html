<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

  --bg:#F4F3F0; --surface:#FFFFFF; --surface-2:#ECEAE4; --ink:#15151E; --ink-soft:#5B5B68;
  --line:#E5E2DB; --brand:#3A40D6; --brand-ink:#3A40D6; --brand-soft:#E5E6FB; --brand-2:#7C5CFF;
  --accent:#FF6A4D; --good:#1F9E63; --warn:#DC9227; --bad:#E14A3B;

}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B0B11; --surface:#14141C; --surface-2:#1D1D28; --ink:#ECECF4; --ink-soft:#9A9AA9;
    --line:#26262F; --brand:#8B90FF; --brand-ink:#9EA2FF; --brand-soft:#1C1D3C; --brand-2:#A98BFF;
    --accent:#FF7D62; --good:#3DB679; --warn:#E6A63E; --bad:#EC6552;

  }
}
:root[data-theme="light"]{
  --bg:#F4F3F0; --surface:#FFFFFF; --surface-2:#ECEAE4; --ink:#15151E; --ink-soft:#5B5B68;
  --line:#E5E2DB; --brand:#3A40D6; --brand-ink:#3A40D6; --brand-soft:#E5E6FB; --brand-2:#7C5CFF;
  --accent:#FF6A4D; --good:#1F9E63; --warn:#DC9227; --bad:#E14A3B;
  --shadow:0 1px 2px rgba(21,21,30,.05),0 10px 30px rgba(21,21,30,.09);
}
:root[data-theme="dark"]{
  --bg:#0B0B11; --surface:#14141C; --surface-2:#1D1D28; --ink:#ECECF4; --ink-soft:#9A9AA9;
  --line:#26262F; --brand:#8B90FF; --brand-ink:#9EA2FF; --brand-soft:#1C1D3C; --brand-2:#A98BFF;
  --accent:#FF7D62; --good:#3DB679; --warn:#E6A63E; --bad:#EC6552;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5; display:flex; justify-content:center;
}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;text-align:left}
a{color:inherit}

.phone{width:100%; max-width:432px; min-height:100vh; background:var(--bg); position:relative; display:flex; flex-direction:column; overflow:hidden}
@media(min-width:480px){
  body{padding:24px 16px; align-items:flex-start}
  .phone{min-height:auto; height:calc(100vh - 48px); max-height:920px; border-radius:36px; box-shadow:var(--shadow); border:1px solid var(--line)}
}
.screen{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{width:0}

/* ---------- HERO / HOMEPAGE ---------- */
.hero{position:relative; padding:26px 22px 30px; background:
  radial-gradient(120% 90% at 82% -8%, var(--brand-soft) 0%, transparent 55%),
  linear-gradient(180deg,var(--surface),var(--bg));
  border-bottom:1px solid var(--line); overflow:hidden}
.brandrow{display:flex; align-items:center; justify-content:space-between}
.brandmark{display:flex; align-items:center; gap:9px}
.shield{width:27px;height:27px}
.wordmark{font-weight:750; font-size:20px; letter-spacing:-.03em}
.wordmark i{color:var(--brand-ink); font-style:normal}
.acct{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:15px;border:1px solid var(--line)}
.h1{font-size:31px; line-height:1.06; letter-spacing:-.035em; font-weight:800; margin:22px 0 0; text-wrap:balance}
.h1 em{font-style:normal; color:var(--brand-ink)}
.sub{margin:11px 0 0; color:var(--ink-soft); font-size:15px; max-width:33ch}

.scanhero{margin:20px 0 0; width:100%; display:flex; align-items:center; gap:14px;
  background:var(--brand); color:#fff; padding:17px 18px; border-radius:16px; box-shadow:0 8px 22px color-mix(in srgb,var(--brand) 40%, transparent);
  transition:transform .08s ease, filter .15s}
.scanhero:active{transform:translateY(1px)} .scanhero:hover{filter:brightness(1.06)}
.scanhero .ic{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.scanhero b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.scanhero span{display:block;font-size:12.5px;opacity:.85}
.searchmini{margin:11px 0 0; display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:12px 14px}
.searchmini input{border:none;background:none;outline:none;flex:1;font-size:14.5px;color:var(--ink)}
.searchmini input::placeholder{color:var(--ink-soft)}

.steps{display:flex; gap:8px; margin:20px 0 0}
.step{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 10px; text-align:center}
.step .n{font-size:16px} .step .t{font-size:11px; color:var(--ink-soft); margin-top:4px; font-weight:600; line-height:1.25}

/* ---------- SECTIONS ---------- */
.sec{padding:24px 22px 0}
.sechead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:13px}
.sechead h2{font-size:16px; letter-spacing:-.02em; font-weight:750; margin:0}
.sechead .note{font-size:12px; color:var(--brand-ink); font-weight:650}

.markets{display:flex; gap:9px; overflow-x:auto; padding:2px 22px 2px; margin:0 0 2px; scrollbar-width:none}
.markets::-webkit-scrollbar{display:none}
.mkt{flex:none; display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:9px 14px 9px 12px; font-size:13px; font-weight:600; white-space:nowrap}
.mkt.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.mkt .e{font-size:14px}

/* small-biz spotlight */
.spot{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.feat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:0; overflow:hidden; box-shadow:var(--shadow); transition:transform .1s ease, border-color .15s}
.feat:hover{transform:translateY(-2px); border-color:var(--brand)}
.feat .top{aspect-ratio:1.5; display:flex; align-items:center; justify-content:center; font-size:38px; position:relative}
.feat .body{padding:12px 13px 14px}
.feat .nm{font-weight:680; font-size:14px; letter-spacing:-.01em; line-height:1.22}
.feat .ct{font-size:11.5px; color:var(--ink-soft); margin-top:2px}
.badge{position:absolute; top:9px; left:9px; display:inline-flex; align-items:center; gap:5px; background:var(--brand-ink); color:#fff; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px; letter-spacing:.01em}
.scorepill{display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:12px; font-weight:700; padding:3px 9px 3px 8px; border-radius:999px; background:var(--surface-2)}
.dot{width:8px;height:8px;border-radius:50%}

/* list rows (feed) */
.row{display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:11px 13px; margin-bottom:10px; box-shadow:var(--shadow); transition:transform .08s ease, border-color .15s; width:100%}
.row:hover{transform:translateY(-1px); border-color:var(--brand)}
.row .th{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:25px;flex:none}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:650;font-size:14px;letter-spacing:-.01em;line-height:1.2}
.row .ct{font-size:11.5px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tagsm{display:inline-flex;align-items:center;gap:4px;color:var(--brand-ink);font-weight:700}
.tagbig{color:var(--ink-soft)}
.row .sc{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none}
.row .sc b{font-size:19px;letter-spacing:-.02em;line-height:1} .row .sc small{font-size:9px;color:var(--ink-soft)}
.divlbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin:18px 2px 12px}

.foot{padding:26px 22px 30px; color:var(--ink-soft); font-size:11.5px; line-height:1.5; text-align:center}

/* ---------- DETAIL ---------- */
.back{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);font-weight:600;font-size:14px;padding:16px 22px 4px}
.dhero{display:flex; gap:15px; align-items:center; padding:4px 22px 4px}
.dhero .th{width:76px;height:76px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:34px;flex:none}
.dhero h1{margin:0;font-size:20px;letter-spacing:-.025em;line-height:1.18;text-wrap:balance}
.dhero .ct{color:var(--ink-soft);font-size:13px;margin-top:5px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}

.scorewrap{display:flex; align-items:center; gap:18px; margin:18px 22px 4px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow)}
.ring{position:relative; width:94px; height:94px; flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.ring .num b{font-size:29px; line-height:1; letter-spacing:-.02em}
.ring .num small{font-size:10px; color:var(--ink-soft); margin-top:2px}
.verdict b{font-size:17px; letter-spacing:-.01em}
.verdict p{margin:5px 0 0; color:var(--ink-soft); font-size:13.5px; line-height:1.45}

.dsec{margin:24px 22px 0}
.dsec h2{font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 12px; font-weight:750}
.flag{background:var(--surface); border:1px solid var(--line); border-radius:15px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow)}
.flag .r{display:flex; align-items:center; gap:9px; justify-content:space-between}
.flag .nm{font-weight:660; font-size:14.5px; letter-spacing:-.01em}
.flag p{margin:8px 0 10px; font-size:13.5px; line-height:1.5}
.sev{font-size:11px;font-weight:750;padding:3px 9px;border-radius:8px;white-space:nowrap}
.source{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft)}
.source a{color:var(--brand-ink);text-decoration:none;font-weight:650;border-bottom:1px solid var(--brand-soft)}

.swap{background:linear-gradient(180deg,var(--brand-soft),var(--surface)); border:1px solid var(--brand); border-radius:var(--radius); padding:16px; margin:8px 22px 0; box-shadow:var(--shadow)}
.swap .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-ink);font-weight:750;display:flex;align-items:center;gap:7px}
.swap .b{display:flex;gap:13px;align-items:center;margin-top:11px}
.swap .th{width:54px;height:54px;font-size:25px;border-radius:13px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.swap .nm{font-weight:680;font-size:15px;letter-spacing:-.01em}
.swap .why{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.buy{margin-top:13px;width:100%;background:var(--brand);color:#fff;padding:13px;border-radius:12px;font-weight:680;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.buy small{opacity:.8;font-weight:500}
.goodnote{margin:16px 22px 0; padding:15px; background:var(--surface); border:1px solid var(--line); border-radius:15px; font-size:13.5px; color:var(--ink-soft); box-shadow:var(--shadow)}
.goodnote b{color:var(--good)}
.disc{margin:22px 22px 10px; font-size:11.5px; color:var(--ink-soft); line-height:1.5; text-align:center}

/* nav */
.nav{display:flex; border-top:1px solid var(--line); background:var(--surface)}
.nav button{flex:1; padding:11px 0 15px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; color:var(--ink-soft); font-weight:600}
.nav button.on{color:var(--brand-ink)}
.nav .ic{font-size:18px;line-height:1}

/* scanning */
.scanning{position:absolute; inset:0; background:var(--bg); display:none; flex-direction:column; align-items:center; justify-content:center; gap:22px; z-index:20}
.scanning.show{display:flex}
.reticle{width:184px;height:184px;border-radius:24px;position:relative;border:2px solid var(--brand-soft)}
.reticle::before{content:"";position:absolute;left:10px;right:10px;top:10px;height:2px;background:var(--brand);border-radius:2px;box-shadow:0 0 14px var(--brand);animation:scan 1.4s ease-in-out infinite}
@keyframes scan{0%{top:10px}50%{top:162px}100%{top:10px}}
.scanning p{color:var(--ink-soft);font-size:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){.reticle::before{animation:none;top:50%}}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
</style>

<div class="phone">
  <div class="screen" id="screen"></div>
  <nav class="nav">
    <button class="on"><span class="ic">⌂</span>Home</button>
    <button><span class="ic">◎</span>Scan</button>
    <button><span class="ic">♡</span>Saved</button>
    <button><span class="ic">◔</span>You</button>
  </nav>
  <div class="scanning" id="scanning"><div class="reticle"></div><p>Reading the label…</p></div>
</div>

const screen=document.getElementById('screen');
let activeMkt="all";

function filtered(){return PRODUCTS.filter(p=>activeMkt==="all"||p.mkt===activeMkt);}
// small businesses first, then by score desc
function ranked(list){return [...list].sort((a,b)=> (b.small-a.small) || (b.score-a.score));}

  const list=ranked(filtered());
  const smalls=list.filter(p=>p.small).slice(0,2);
  const rest=list.filter(p=>!smalls.includes(p));
  screen.innerHTML=`
  <div class="hero">
    <div class="brandrow">
      <div class="brandmark">${SHIELD}<span class="wordmark">Guar<i>di</i></span></div>
      <div class="acct">🙂</div>
    </div>
    <h1 class="h1">Know what's <em>really</em> in it.</h1>
    <p class="sub">Scan any product. Get the truth — every claim cited — and a cleaner swap from a brand that earns it.</p>
    <button class="scanhero" id="scan">
      <span class="ic">📷</span>
      <span style="flex:1"><b>Scan a product</b><span>Point your camera at any label</span></span>
      <span aria-hidden="true" style="font-size:20px">›</span>
    </button>
    <div class="searchmini"><span style="color:var(--ink-soft)">⌕</span><input placeholder="…or search a product" aria-label="Search"></div>
    <div class="steps">
      <div class="step"><div class="n">📷</div><div class="t">Scan it</div></div>
      <div class="step"><div class="n">🔎</div><div class="t">See the truth</div></div>
      <div class="step"><div class="n">↔️</div><div class="t">Swap it</div></div>
    </div>
  </div>

  <div class="markets">
    ${MARKETS.map(m=>`<button class="mkt ${m[0]===activeMkt?'on':''}" data-m="${m[0]}"><span class="e">${m[1]}</span>${m[2]}</button>`).join('')}
  </div>

  <div class="sec">
    <div class="sechead"><h2>Small businesses, first</h2><span class="note">why? →</span></div>
    <div class="spot">
      ${smalls.map(p=>{const b=band(p.score);return `<button class="feat" data-id="${p.id}">
        <div class="top" style="background:${p.tint}"><span class="badge">✦ Independent</span>${p.emoji}</div>
        <div class="body"><div class="nm">${p.name}</div><div class="ct">${p.brand}</div>
          <span class="scorepill"><span class="dot" style="background:${b.c}"></span><span class="mono" style="color:${b.c}">${p.score}</span></span></div>
      </button>`;}).join('')}
    </div>
  </div>

  <div class="sec">
    <div class="divlbl">More in ${MARKETS.find(m=>m[0]===activeMkt)[2]}</div>
    ${rest.map(p=>{const b=band(p.score);return `<button class="row" data-id="${p.id}">
      <div class="th" style="background:${p.tint}">${p.emoji}</div>
      <div class="mid"><div class="nm">${p.name}</div>
        <div class="ct">${p.small?`<span class="tagsm">✦ Small business</span>`:`<span class="tagbig">${p.brand} · brand</span>`}</div></div>
      <div class="sc"><b class="mono" style="color:${b.c}">${p.score}</b><small>/100</small></div>
    </button>`;}).join('')}
  </div>
  <p class="foot">Small brands rank first — that's the point. Guardi aggregates cited third-party sources (EWG, CSPI, FDA, peer-reviewed) and reports what they say; it doesn't decide truth itself.<br><br><b style="color:var(--ink-soft)">Prototype · sample data for demonstration.</b></p>`;

  document.getElementById('scan').onclick=scan;
  screen.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>detail(el.dataset.id));
  screen.querySelectorAll('[data-m]').forEach(el=>el.onclick=()=>{activeMkt=el.dataset.m;home();});
}

function scan(){
  const ov=document.getElementById('scanning'); ov.classList.add('show');
  const pool=PRODUCTS.filter(p=>p.score<60); const pick=pool[Math.floor(Math.random()*pool.length)];
  setTimeout(()=>{ov.classList.remove('show'); detail(pick.id);},1500);
}

function detail(id){
  const p=PRODUCTS.find(x=>x.id===id); if(!p)return; window.scrollTo(0,0);
  const b=band(p.score), R=41, C=2*Math.PI*R, off=C*(1-p.score/100);
  screen.innerHTML=`
  <button class="back" id="back">‹ Back</button>
  <div class="dhero"><div class="th" style="background:${p.tint}">${p.emoji}</div>
    <div><h1>${p.name}</h1><div class="ct">${p.small?`<span class="tagsm">✦ Small business</span>`:`${p.brand} · brand`}</div></div></div>
  <div class="scorewrap">
    <div class="ring"><svg width="94" height="94" viewBox="0 0 94 94">
      <circle cx="47" cy="47" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="8"/>
      <circle cx="47" cy="47" r="${R}" fill="none" stroke="${b.c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg><div class="num"><b class="mono" style="color:${b.c}">${p.score}</b><small>/ 100</small></div></div>
    <div class="verdict"><b style="color:${b.c}">${b.w}</b><p>${p.bottom}</p></div>
  </div>
  <div class="dsec"><h2>What's inside — and where we got it</h2>
    ${p.flags.map(f=>{const s=SEV[f.sev];return `<div class="flag"><div class="r"><span class="nm">${f.nm}</span>
      <span class="sev" style="background:${s.bg};color:${s.fg}">${s.lbl}</span></div><p>${f.txt}</p>
      <span class="source">Source: <a href="${f.url}" target="_blank" rel="noopener">${f.src}</a> ↗</span></div>`;}).join('')}
  </div>
  ${p.swap?`<div class="dsec"><h2 style="margin-bottom:8px">A cleaner swap</h2></div>
  <div class="swap"><span class="lbl">✦ Guardi recommends a small brand</span>
    <div class="b"><div class="th">${p.swap.emoji}</div>
      <div style="flex:1"><div class="nm">${p.swap.name}</div><div class="why">${p.swap.why}</div></div>
      <span class="scorepill mono" style="background:var(--surface);color:var(--good)">${p.swap.score}</span></div>
    <button class="buy" onclick="alert('In the real app this opens the seller — Guardi earns a small affiliate cut. No inventory, ever.')">Find it &amp; buy <small>· affiliate</small></button>
  </div>`:`<div class="goodnote"><b>You're good.</b> Nothing to flag — a genuinely clean choice. No swap needed.</div>`}
  <p class="disc">Sample data for this prototype. Real Guardi cites live third-party sources for every claim.</p><div style="height:14px"></div>`;
  document.getElementById('back').onclick=home;
}
home();
</script>
