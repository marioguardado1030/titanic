// ---------- state + storage ----------
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const screenEl=document.getElementById('screen');
let activeMkt="all";
let MONETIZE=load('guardi_monetize',false);
let HISTORY=load('guardi_hist',[]);
let SAVED=load('guardi_saved',[]);
let A=load('guardi_analytics',{scans:0,searches:0,views:0,swapClicks:0,adImpr:0,adClicks:0,sessions:0,days:[]});
// session bump (once per load)
A.sessions=(A.sessions||0)+1; const _t=todayStr(); if(!A.days.includes(_t))A.days.push(_t); save('guardi_analytics',A);
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function bump(k,n){A[k]=(A[k]||0)+(n||1);save('guardi_analytics',A);}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2400);}
function ranked(list){return [...list].sort((a,b)=>(b.small-a.small)||(b.score-a.score));}
function cat(m){return ranked(PRODUCTS.filter(p=>p.mkt===m));}
function byIds(ids){return ids.map(i=>PRODUCTS.find(p=>p.id===i)).filter(Boolean);}
function recommended(){const mkts=[...new Set(byIds(HISTORY).map(p=>p.mkt))];let pool=PRODUCTS.filter(p=>!HISTORY.includes(p.id)&&(mkts.length?mkts.includes(p.mkt):true));if(pool.length<4)pool=PRODUCTS.filter(p=>!HISTORY.includes(p.id));return ranked(pool).slice(0,6);}

// ---------- AD-RANKING ENGINE ----------
// Off  -> pure organic, small-business-first (day 1).
// On   -> slots 1 & 3 organic small-biz, slots 2 & 4 sponsored enterprise, rest a mix.
// Slot numbers are FIXED by plan position, so 1&3 are always organic and 2&4 always sponsored;
// a missing type simply leaves that slot empty rather than mislabeling.
const seenAds=new Set(); // unique sponsored products viewed this session (impression dedup)
function rankWithAds(list){
  if(!MONETIZE) return ranked(list).map(p=>({p,ad:false,slot:null}));
  const smalls=ranked(list.filter(p=>p.small));
  const sponsored=ranked(list.filter(p=>!p.small&&p.sponsored));
  const out=[]; const used=new Set();
  const takeSmall=()=>{const x=smalls.find(p=>!used.has(p.id));if(x){used.add(x.id);return x}};
  const takeSpon=()=>{const x=sponsored.find(p=>!used.has(p.id));if(x){used.add(x.id);return x}};
  const plan=[{slot:1,type:'small'},{slot:2,type:'spon'},{slot:3,type:'small'},{slot:4,type:'spon'}];
  plan.forEach(({slot,type})=>{const p=type==='small'?takeSmall():takeSpon();if(p)out.push({p,ad:type==='spon',slot});});
  const rest=ranked(list.filter(p=>!used.has(p.id)));
  rest.forEach(p=>out.push({p,ad:!!p.sponsored,slot:null}));
  return out;
}

function ccard(p){const b=band(p.score);const isAd=MONETIZE&&p.sponsored;if(isAd&&!seenAds.has(p.id)){seenAds.add(p.id);bump('adImpr');}
  const sub=isAd?'<span class="adlbl">Sponsored</span>':(p.small?'✦ Small business':p.brand);
  return `<div class="cc"><button class="feat" data-id="${p.id}" data-ad="${isAd?1:0}"><div class="top" style="background:${p.tint}">${p.small?'<span class="badge">✦ Independent</span>':''}${p.emoji}</div><div class="body"><div class="nm">${p.name}</div><div class="ct ${p.small?'sm':''}">${sub}</div><span class="scorepill"><span class="dot" style="background:${b.c}"></span><span class="mono" style="color:${b.c}">${p.score}</span></span></div></button></div>`;}

function adRow(o){const p=o.p,b=band(p.score);if(o.ad&&!seenAds.has(p.id)){seenAds.add(p.id);bump('adImpr');}
  const tag=o.ad?'<span class="adlbl">Sponsored</span>':(p.small?'<span class="tagorg">✦ Organic · small business</span>':`${p.brand}`);
  const slot=o.slot?`<span class="slotn">Slot ${o.slot} · ${o.ad?'paid':'earned'}</span>`:'';
  return `<button class="row ${o.ad?'ad':''}" data-id="${p.id}" data-ad="${o.ad?1:0}">${slot}<div class="th" style="background:${p.tint}">${p.emoji}</div><div class="mid"><div class="nm">${p.name}</div><div class="ct">${tag}</div></div><div class="sc"><b class="mono" style="color:${b.c}">${p.score}</b><small>/100</small></div></button>`;}

// ---------- HOME ----------
function heroHTML(){return `<div class="hero"><div class="brandrow"><div class="brandmark">${SHIELD}<span class="wordmark">Guar<i>di</i></span></div><div class="acct">🙂</div></div><h1 class="h1">Know what's <em>really</em> in it.</h1><p class="sub">Take a picture of any product. Get the truth, cited — plus a cleaner swap.</p><button class="scanhero" id="scan"><span class="ic">📷</span><span style="flex:1"><b>Take a picture</b><span>Point your camera at any product or label</span></span><span aria-hidden="true" style="font-size:19px">›</span></button><div class="searchmini"><span style="color:var(--ink-soft)" aria-hidden="true">⌕</span><input id="q" placeholder="Search products" aria-label="Search products"><span aria-hidden="true">📷</span></div><div class="miniflow"><b>📷 Snap</b><span class="sep">·</span><b>🔎 See the truth</b><span class="sep">·</span><b>↔ Swap</b></div></div>`;}
function marketsHTML(){return `<div class="markets">${MARKETS.map(m=>`<button class="mkt ${m[0]===activeMkt?'on':''}" data-m="${m[0]}"><span class="e">${m[1]}</span>${m[2]}</button>`).join('')}</div>`;}

function homeBodyHTML(qv){
  if(qv){const ql=qv.toLowerCase();const hits=PRODUCTS.filter(p=>(p.name+" "+p.brand+" "+p.mkt).toLowerCase().includes(ql));const safe=qv.replace(/[<>&"]/g,'');
    if(!hits.length)return `<div class="sechead"><h2>Results for “${safe}”</h2></div><div class="list"><p style="color:var(--ink-soft);font-size:13.5px;padding:4px 2px">Nothing found — try “cereal”, “soap”, or “noodles”.</p></div>`;
    return `<div class="sechead"><h2>Results for “${safe}”</h2>${MONETIZE?'<span class="note">incl. sponsored</span>':''}</div><div class="list">${rankWithAds(hits).map(adRow).join('')}</div>`;}
  let body="";
  if(activeMkt==="all"){
    if(HISTORY.length){const recents=byIds(HISTORY).slice(0,6);body+=`<div class="sechead"><h2>Pick up where you left off</h2></div><div class="carou">${recents.map(ccard).join('')}</div>`;const recs=recommended();if(recs.length)body+=`<div class="sechead"><h2>Recommended for you</h2><span class="note">from your activity</span></div><div class="carou">${recs.map(ccard).join('')}</div>`;}
    const smalls=ranked(PRODUCTS.filter(p=>p.small)).slice(0,4);body+=`<div class="sechead"><h2>Small businesses we love</h2><button class="note" id="whynote">why? →</button></div><div class="carou">${smalls.map(ccard).join('')}</div>`;
    CATS.forEach(([m,label])=>{body+=`<div class="sechead"><h2>Popular in ${label}</h2></div><div class="carou">${cat(m).map(ccard).join('')}</div>`;});
  } else {
    const label=MARKETS.find(m=>m[0]===activeMkt)[2];
    body+=`<div class="sechead"><h2>${label}</h2><span class="note">${MONETIZE?'organic + sponsored':'small brands first'}</span></div><div class="list">${rankWithAds(PRODUCTS.filter(p=>p.mkt===activeMkt)).map(adRow).join('')}</div>`;
  }
  return body;
}
function wireBody(){
  screenEl.querySelectorAll('#homebody [data-id]').forEach(el=>el.onclick=()=>{if(el.dataset.ad==="1")bump('adClicks');detail(el.dataset.id);});
  const w=document.getElementById('whynote');if(w)w.onclick=()=>toast("Independent brands earn the top organic slots when quality matches. Big brands can only buy the alternating 'Sponsored' slots — never the verdict.");
}
function renderBody(qv){document.getElementById('homebody').innerHTML=homeBodyHTML(qv);wireBody();}
function home(){setActive('nav-home');screenEl.scrollTop=0;screenEl.innerHTML=heroHTML()+marketsHTML()+`<div id="homebody"></div>`+`<p class="foot">Departments ordered by market size. Small brands rank first inside each. ${MONETIZE?'<b style="color:var(--spon)">Monetization ON</b> — sponsored items are always labeled (slots 2 & 4 in results); the health score is never for sale.':'Monetization is OFF (launch mode) — pure organic ranking.'}<br><br><b style="color:var(--ink-soft)">Prototype · sample data.</b></p>`;
  renderBody("");document.getElementById('scan').onclick=scan;const q=document.getElementById('q');q.oninput=()=>{renderBody(q.value.trim());clearTimeout(q._t);q._t=setTimeout(()=>{if(q.value.trim())bump('searches');},900);};
  screenEl.querySelectorAll('[data-m]').forEach(el=>el.onclick=()=>{activeMkt=el.dataset.m;home();});}

// ---------- SCAN (real camera capture) ----------
const camInput=document.getElementById('cam');
camInput.onchange=()=>{if(camInput.files&&camInput.files.length)runScan();camInput.value="";};
function scan(){camInput.click();} // opens the real camera on mobile; file picker on desktop
function runScan(){const ov=document.getElementById('scanning');if(ov.classList.contains('show'))return;ov.classList.add('show');bump('scans');activeMkt="all";let pool=PRODUCTS.filter(p=>p.score<60);if(!pool.length)pool=PRODUCTS;const pick=pool[Math.floor(Math.random()*pool.length)];setTimeout(()=>{ov.classList.remove('show');detail(pick.id);},1500);}

// ---------- DETAIL ----------
function detail(id){const p=PRODUCTS.find(x=>x.id===id);if(!p)return;HISTORY=[id,...HISTORY.filter(x=>x!==id)].slice(0,8);save('guardi_hist',HISTORY);bump('views');screenEl.scrollTop=0;
  const b=band(p.score),R=41,C=2*Math.PI*R,off=C*(1-p.score/100);const isSaved=SAVED.includes(id);
  screenEl.innerHTML=`<button class="back" id="back">‹ Back</button><div class="dhero"><div class="th" style="background:${p.tint}">${p.emoji}</div><div><h1>${p.name}</h1><div class="ct">${p.small?'<span class="tagsm" style="color:var(--brand-ink);font-weight:700">✦ Small business</span>':p.brand+' · brand'}</div></div></div>
  <div class="scorewrap"><div class="ring"><svg width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="46" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="8"/><circle cx="46" cy="46" r="${R}" fill="none" stroke="${b.c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="num"><b class="mono" style="color:${b.c}">${p.score}</b><small>/ 100</small></div></div><div class="verdict"><b style="color:${b.c}">${band(p.score).w}</b><p>${p.bottom}</p></div></div>
  <div class="dsec"><h2>What's inside — and where we got it</h2>${p.flags.map(f=>{const s=SEV[f.sev];return `<div class="flag"><div class="r"><span class="nm">${f.nm}</span><span class="sev" style="background:${s.bg};color:${s.fg}">${s.lbl}</span></div><p>${f.txt}</p><span class="source">Source: <a href="${f.url}" target="_blank" rel="noopener">${f.src}</a> ↗</span></div>`;}).join('')}</div>
  ${p.swap?`<div class="dsec"><h2 style="margin-bottom:8px">A cleaner swap</h2></div><div class="swap"><span class="lbl">✦ Guardi recommends a small brand</span><div class="b"><div class="th">${p.swap.emoji}</div><div style="flex:1"><div class="nm">${p.swap.name}</div><div class="why">${p.swap.why}</div></div><span class="scorepill mono" style="background:var(--surface);color:var(--good)">${p.swap.score}</span></div><button class="buy" id="buybtn">Find it &amp; buy <small>· affiliate</small></button></div>`:`<div class="goodnote"><b>You're good.</b> Nothing to flag — a genuinely clean choice.</div>`}
  <button class="savebtn" id="savebtn">${isSaved?'♥ Saved':'♡ Save this'}</button>
  <p class="disc">Sample data for this prototype. Real Guardi cites live third-party sources for every claim.</p><div style="height:14px"></div>`;
  const bk=document.getElementById('back');bk.onclick=home;bk.focus({preventScroll:true});
  const bb=document.getElementById('buybtn');if(bb)bb.onclick=()=>{bump('swapClicks');toast("In the real app this opens the seller — Guardi earns a small affiliate cut. No inventory, ever.");};
  document.getElementById('savebtn').onclick=(e)=>{if(SAVED.includes(id)){SAVED=SAVED.filter(x=>x!==id);e.target.textContent='♡ Save this';}else{SAVED=[id,...SAVED];e.target.textContent='♥ Saved';}save('guardi_saved',SAVED);};
}

  <p class="disc">Prototype · analytics stored locally on this device only.</p><div style="height:14px"></div>`;

  sw.onclick=flip;sw.onkeydown=(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}};}

function setActive(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.id===id));}
document.getElementById('nav-home').onclick=()=>{activeMkt="all";home();};
