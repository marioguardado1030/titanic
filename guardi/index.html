    bottom:"Short, honest ingredient list. No synthetic fragrance, no dyes, no parabens.",
    flags:[{nm:"Fragrance-free",sev:"good",txt:"'Fragrance' can hide dozens of undisclosed chemicals — this skips it entirely.",src:"EWG Skin Deep",url:"https://www.ewg.org"},
           {nm:"No parabens or sulfates",sev:"good",txt:"Avoids the two ingredient families shoppers most want to skip.",src:"EWG",url:"https://www.ewg.org"}],swap:null},
  {id:"serum",small:0,mkt:"beauty",emoji:"🧴",tint:"#EBD3D8",brand:"GlowMax",name:"Anti-Aging Serum",score:44,
    bottom:"Some real actives, but buried under synthetic fragrance and a preservative shoppers often avoid.",
    flags:[{nm:"'Fragrance' (undisclosed)",sev:"med",txt:"A single word that can hide dozens of chemicals; a top driver of skin reactions.",src:"EWG Skin Deep",url:"https://www.ewg.org"},
           {nm:"Phenoxyethanol",sev:"low",txt:"Common preservative; generally fine in small amounts, flagged by sensitive-skin users.",src:"EWG",url:"https://www.ewg.org"},
           {nm:"Contains retinol",sev:"good",txt:"A genuinely evidence-backed skin active — the real reason it works.",src:"peer-reviewed",url:"https://pubmed.ncbi.nlm.nih.gov"}],
    swap:{emoji:"🧴",name:"Clean Canvas Fragrance-Free Serum",score:78,why:"Small brand: same retinol, no synthetic fragrance."}}
];

const screen=document.getElementById('screen');
let activeMkt="all";
function ranked(list){return [...list].sort((a,b)=>(b.small-a.small)||(b.score-a.score));}
function cat(m){return ranked(PRODUCTS.filter(p=>p.mkt===m));}

// dynamic homepage: remember what the user looks at
let HISTORY=[]; try{HISTORY=JSON.parse(localStorage.getItem('guardi_hist')||'[]')}catch(e){}
function record(id){HISTORY=[id,...HISTORY.filter(x=>x!==id)].slice(0,8); try{localStorage.setItem('guardi_hist',JSON.stringify(HISTORY))}catch(e){}}
function byIds(ids){return ids.map(i=>PRODUCTS.find(p=>p.id===i)).filter(Boolean);}
function recommended(){
  const mkts=[...new Set(byIds(HISTORY).map(p=>p.mkt))];
  let pool=PRODUCTS.filter(p=>!HISTORY.includes(p.id) && (mkts.length?mkts.includes(p.mkt):true));
  if(pool.length<4) pool=PRODUCTS.filter(p=>!HISTORY.includes(p.id));
  return ranked(pool).slice(0,6);
}

function ccard(p){const b=band(p.score);return `<div class="cc"><button class="feat" data-id="${p.id}">
  <div class="top" style="background:${p.tint}">${p.small?'<span class="badge">✦ Independent</span>':''}${p.emoji}</div>
  <div class="body"><div class="nm">${p.name}</div><div class="ct ${p.small?'sm':''}">${p.small?'✦ Small business':p.brand}</div>
    <span class="scorepill"><span class="dot" style="background:${b.c}"></span><span class="mono" style="color:${b.c}">${p.score}</span></span></div>
</button></div>`;}

function lrow(p){const b=band(p.score);return `<button class="row" data-id="${p.id}">
  <div class="th" style="background:${p.tint}">${p.emoji}</div>
  <div class="mid"><div class="nm">${p.name}</div><div class="ct">${p.small?'<span class="tagsm">✦ Small business</span>':p.brand+' · brand'}</div></div>
  <div class="sc"><b class="mono" style="color:${b.c}">${p.score}</b><small>/100</small></div></button>`;}

function heroHTML(){return `<div class="hero">
  <div class="brandrow"><div class="brandmark">${SHIELD}<span class="wordmark">Guar<i>di</i></span></div><div class="acct">🙂</div></div>
  <h1 class="h1">Know what's <em>really</em> in it.</h1>
  <p class="sub">Take a picture of any product. Get the truth, cited — plus a cleaner swap.</p>
  <button class="scanhero" id="scan"><span class="ic">📷</span>
    <span style="flex:1"><b>Take a picture</b><span>Point your camera at any product or label</span></span>
    <span aria-hidden="true" style="font-size:19px">›</span></button>
  <div class="searchmini"><span style="color:var(--ink-soft)">⌕</span><input placeholder="Search products" aria-label="Search"><span class="cam">📷</span></div>
  <div class="miniflow"><b>📷 Snap</b><span class="sep">·</span><b>🔎 See the truth</b><span class="sep">·</span><b>↔ Swap</b></div>
</div>`;}

function marketsHTML(){return `<div class="markets">${MARKETS.map(m=>`<button class="mkt ${m[0]===activeMkt?'on':''}" data-m="${m[0]}"><span class="e">${m[1]}</span>${m[2]}</button>`).join('')}</div>`;}

function home(){
  window.scrollTo(0,0);
  let body="";
  if(activeMkt==="all"){
    if(HISTORY.length){
      const recents=byIds(HISTORY).slice(0,6);
      body += `<div class="sechead"><h2>Pick up where you left off</h2></div><div class="carou">${recents.map(ccard).join('')}</div>`;
      const recs=recommended();
      if(recs.length) body += `<div class="sechead"><h2>Recommended for you</h2><span class="note">from your activity</span></div><div class="carou">${recs.map(ccard).join('')}</div>`;
    }
    const smalls=ranked(PRODUCTS.filter(p=>p.small)).slice(0,4);
    body += `<div class="sechead"><h2>Small businesses we love</h2><span class="note">why? →</span></div>
      <div class="carou">${smalls.map(ccard).join('')}</div>`;
    CATS.forEach(([m,label])=>{
      body += `<div class="sechead"><h2>Popular in ${label}</h2></div><div class="carou">${cat(m).map(ccard).join('')}</div>`;
    });
  } else {
    const label=MARKETS.find(m=>m[0]===activeMkt)[2];
    body += `<div class="sechead"><h2>${label}</h2><span class="note">small brands first</span></div>
      <div class="list">${cat(activeMkt).map(lrow).join('')}</div>`;
  }
  screen.innerHTML = heroHTML() + marketsHTML() + body +
    `<p class="foot">Departments are ordered by market size. Small brands rank first inside each — that's the point. Guardi aggregates cited third-party sources (EWG, CSPI, FDA, peer-reviewed) and reports what they say.<br><br><b style="color:var(--ink-soft)">Prototype · sample data for demonstration.</b></p>`;
  document.getElementById('scan').onclick=scan;
  screen.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>detail(el.dataset.id));
  screen.querySelectorAll('[data-m]').forEach(el=>el.onclick=()=>{activeMkt=el.dataset.m;home();});
}

function scan(){
  const ov=document.getElementById('scanning'); ov.classList.add('show');
  const pool=PRODUCTS.filter(p=>p.score<60); const pick=pool[Math.floor(Math.random()*pool.length)];
  setTimeout(()=>{ov.classList.remove('show'); detail(pick.id);},1500);
}

function detail(id){
  const p=PRODUCTS.find(x=>x.id===id); if(!p)return; record(id); window.scrollTo(0,0);
  const b=band(p.score),R=41,C=2*Math.PI*R,off=C*(1-p.score/100);
  screen.innerHTML=`<button class="back" id="back">‹ Back</button>
  <div class="dhero"><div class="th" style="background:${p.tint}">${p.emoji}</div>
    <div><h1>${p.name}</h1><div class="ct">${p.small?'<span class="tagsm" style="color:var(--brand-ink);font-weight:700">✦ Small business</span>':p.brand+' · brand'}</div></div></div>
  <div class="scorewrap"><div class="ring"><svg width="92" height="92" viewBox="0 0 92 92">
    <circle cx="46" cy="46" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="8"/>
    <circle cx="46" cy="46" r="${R}" fill="none" stroke="${b.c}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg><div class="num"><b class="mono" style="color:${b.c}">${p.score}</b><small>/ 100</small></div></div>
    <div class="verdict"><b style="color:${b.c}">${b.w}</b><p>${p.bottom}</p></div></div>
  <div class="dsec"><h2>What's inside — and where we got it</h2>
    ${p.flags.map(f=>{const s=SEV[f.sev];return `<div class="flag"><div class="r"><span class="nm">${f.nm}</span><span class="sev" style="background:${s.bg};color:${s.fg}">${s.lbl}</span></div><p>${f.txt}</p><span class="source">Source: <a href="${f.url}" target="_blank" rel="noopener">${f.src}</a> ↗</span></div>`;}).join('')}</div>
  ${p.swap?`<div class="dsec"><h2 style="margin-bottom:8px">A cleaner swap</h2></div>
  <div class="swap"><span class="lbl">✦ Guardi recommends a small brand</span>
    <div class="b"><div class="th">${p.swap.emoji}</div><div style="flex:1"><div class="nm">${p.swap.name}</div><div class="why">${p.swap.why}</div></div>
      <span class="scorepill mono" style="background:var(--surface);color:var(--good)">${p.swap.score}</span></div>
    <button class="buy" onclick="alert('In the real app this opens the seller — Guardi earns a small affiliate cut. No inventory, ever.')">Find it &amp; buy <small>· affiliate</small></button>
  </div>`:`<div class="goodnote"><b>You're good.</b> Nothing to flag — a genuinely clean choice.</div>`}
  <p class="disc">Sample data for this prototype. Real Guardi cites live third-party sources for every claim.</p><div style="height:14px"></div>`;
  document.getElementById('back').onclick=home;
}
home();
</script>
